name: Temporary Windows documentation test
on:
  push:
    branches: [qa/temporary-windows-20261108]
permissions:
  contents: read
jobs:
  windows-readme:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Follow PowerShell installation instructions
        shell: pwsh
        run: |
          py -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\Activate.ps1
          python -m pip install .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item .env.example .env
          rowport --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "C:\Program Files\PostgreSQL\17\bin\psql.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'WINDOWS_README_SETUP_OK'
