name: Temporary Windows compatibility test
on:
  push:
    branches: [qa/temporary-windows-20261108]
permissions:
  contents: read
jobs:
  windows-diagnostics:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare application and database
        shell: pwsh
        env:
          PGPASSWORD: root
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Service -Name postgresql-x64-17 -StartupType Manual
          Start-Service -Name postgresql-x64-17
          & "$env:PGBIN\psql.exe" -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f examples/properties.sql
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Get-Command psql -ErrorAction SilentlyContinue) { Write-Output 'PSQL_ON_PATH=True' } else { Write-Output 'PSQL_ON_PATH=False' }
      - name: Diagnose BOM and Unicode handling
        shell: pwsh
        run: |
          @'
          import locale, os, pathlib, subprocess, sys
          print('PYTHON_ENCODING=', sys.stdout.encoding, 'LOCALE=', locale.getencoding(), 'UTF8MODE=', sys.flags.utf8_mode)
          env = os.environ.copy()
          env.pop('DATABASE_URL', None)
          exe = str(pathlib.Path('.venv/Scripts/rowport.exe').resolve())
          env_path = pathlib.Path('.env')
          config = 'DATABASE_URL=postgresql://postgres:root@127.0.0.1:5432/postgres\n'
          for encoding in ('utf-8-sig', 'utf-8'):
              env_path.write_text(config, encoding=encoding)
              result = subprocess.run([exe, 'validate', 'examples/properties.csv', '--table', 'properties'], capture_output=True, env=env)
              print('ENV_ENCODING=', encoding, 'EXIT=', result.returncode, 'STDERR=', result.stderr.decode('utf-8', 'replace').strip())
          sample = pathlib.Path('windows-unicode-sample.csv')
          sample.write_text('address,price,rooms\nEspa\u00f1a \U0001f9c9,100,1\n', encoding='utf-8')
          for mode in ('default', 'utf8'):
              settings = env.copy()
              if mode == 'utf8': settings['PYTHONUTF8'] = '1'
              result = subprocess.run([exe, 'preview', str(sample)], capture_output=True, env=settings)
              print('PREVIEW_MODE=', mode, 'EXIT=', result.returncode, 'STDERR=', result.stderr.decode('utf-8', 'replace').strip())
          '@ | .\.venv\Scripts\python.exe -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
